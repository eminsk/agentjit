name: CI Test Suite & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"
          - "pypy-3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          python -m pip install "typing-extensions>=4.0; python_version < '3.10'" rich
          python -m pip install -e .

      - name: Run Pytest Test Suite
        run: pytest -v tests/

      - name: Verify Examples Execution
        run: |
          python examples/01_quickstart.py
          python examples/02_ecommerce_agent.py
          python examples/03_guard_bailout.py

      - name: Verify Benchmark Execution
        run: python benchmarks/benchmark_speedup.py

  test-cpython-316:
    name: CPython 3.16 (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: "standard"
            configure-args: ""
            gil-flag: ""
          - mode: "free-threaded-nogil"
            configure-args: "--disable-gil"
            gil-flag: "-X gil=0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date for cache
        id: cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache CPython 3.16 build
        id: cache-cpython
        uses: actions/cache@v4
        with:
          path: /home/runner/py316-${{ matrix.mode }}
          key: cpython-316-${{ matrix.mode }}-${{ steps.cache-date.outputs.date }}

      - name: Build CPython 3.16 from source (if not cached)
        if: steps.cache-cpython.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev libffi-dev libsqlite3-dev
          git clone --depth 1 https://github.com/python/cpython.git /tmp/cpython
          cd /tmp/cpython
          ./configure --prefix=/home/runner/py316-${{ matrix.mode }} ${{ matrix.configure-args }}
          make -j$(nproc)
          make install

      - name: Verify CPython 3.16 & GIL state
        run: |
          PYTHON_BIN=$(find /home/runner/py316-${{ matrix.mode }}/bin -name "python3*" -type f -executable | head -n 1)
          $PYTHON_BIN -VV
          $PYTHON_BIN ${{ matrix.gil-flag }} -c "import sys; print('CPython 3.16 Version:', sys.version); print('Free-Threading GIL active:', getattr(sys, '_is_gil_enabled', lambda: 'N/A')())"

      - name: Install dependencies & run tests
        run: |
          PYTHON_BIN=$(find /home/runner/py316-${{ matrix.mode }}/bin -name "python3*" -type f -executable | head -n 1)
          $PYTHON_BIN -m ensurepip --default-pip || true
          $PYTHON_BIN -m pip install --upgrade pip pytest rich || true
          $PYTHON_BIN -m pip install -e . --no-deps || true
          $PYTHON_BIN ${{ matrix.gil-flag }} -m pytest -v tests/
