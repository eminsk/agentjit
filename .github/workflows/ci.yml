name: CI Test Suite & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        run: uv run pytest -v tests/

      - name: Verify Examples Execution
        run: |
          uv run python examples/01_quickstart.py
          uv run python examples/02_ecommerce_agent.py
          uv run python examples/03_guard_bailout.py

      - name: Verify Benchmark Execution
        run: uv run python benchmarks/benchmark_speedup.py
