name: CI Test Suite & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          python -m pip install "typing-extensions>=4.0; python_version < '3.10'" rich
          python -m pip install -e .

      - name: Run Pytest Test Suite
        run: pytest -v tests/

      - name: Verify Examples Execution
        run: |
          python examples/01_quickstart.py
          python examples/02_ecommerce_agent.py
          python examples/03_guard_bailout.py

      - name: Verify Benchmark Execution
        run: python benchmarks/benchmark_speedup.py
