name: CI Test Suite & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Set up Python venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        run: uv run --python ${{ matrix.python-version }} pytest -v tests/

      - name: Verify Examples Execution
        run: |
          uv run --python ${{ matrix.python-version }} python examples/01_quickstart.py
          uv run --python ${{ matrix.python-version }} python examples/02_ecommerce_agent.py
          uv run --python ${{ matrix.python-version }} python examples/03_guard_bailout.py

      - name: Verify Benchmark Execution
        run: uv run --python ${{ matrix.python-version }} python benchmarks/benchmark_speedup.py
