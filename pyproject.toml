[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentjit"
version = "0.1.3"
description = "Just-In-Time Compiler for AI Agent Trajectories. Compiles multi-step LLM workflows into ultra-fast deterministic Python code with zero token cost."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentJIT Team" }
]
keywords = [
    "ai",
    "agents",
    "jit",
    "compiler",
    "llm",
    "optimization",
    "workflow",
    "performance",
    "nogil",
    "freethreading",
    "free-threaded",
    "no-gil",
    "pep-703",
    "pypy",
    "pypy3"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "typing-extensions>=4.0; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/eminsk/agentjit"
Documentation = "https://github.com/eminsk/agentjit#readme"
Repository = "https://github.com/eminsk/agentjit.git"
Issues = "https://github.com/eminsk/agentjit/issues"
"Interactive Colab Demo" = "https://colab.research.google.com/github/eminsk/agentjit/blob/main/notebooks/AgentJIT_Interactive_Demo.ipynb"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
    "rich>=12.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
